name: One-time migrate GitHub secrets to AWS

on:
  pull_request:
    types: [opened]
    branches:
      - master

permissions:
  contents: read

jobs:
  migrate-secrets:
    # Do not run this migration for fork PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Migrate repository secrets
        shell: bash
        env:
          JIRASERVER_BASE_URL: ${{ secrets.JIRASERVER_BASE_URL }}
          JIRASERVER_PASSWORD: ${{ secrets.JIRASERVER_PASSWORD }}
          JIRASERVER_PROJECT_KEY: ${{ secrets.JIRASERVER_PROJECT_KEY }}
          JIRASERVER_USERNAME: ${{ secrets.JIRASERVER_USERNAME }}
          XRAYSERVER_TEST_PLAN_KEY: ${{ secrets.XRAYSERVER_TEST_PLAN_KEY }}

          AWS_SECRET_NAME: github/Xray-App/xray-postman-collections

        run: |
          set -euo pipefail

          umask 077

          # Check that all required GitHub secrets are available.
          required_vars=(
            JIRASERVER_BASE_URL
            JIRASERVER_PASSWORD
            JIRASERVER_PROJECT_KEY
            JIRASERVER_USERNAME
            XRAYSERVER_TEST_PLAN_KEY
          )

          for var in "${required_vars[@]}"; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::Required GitHub secret '$var' is missing or empty."
              exit 1
            fi
          done

          SECRET_FILE="$(mktemp)"
          trap 'rm -f "$SECRET_FILE"' EXIT

          # Build JSON without printing secret values.
          jq -n '{
            JIRASERVER_BASE_URL: env.JIRASERVER_BASE_URL,
            JIRASERVER_PASSWORD: env.JIRASERVER_PASSWORD,
            JIRASERVER_PROJECT_KEY: env.JIRASERVER_PROJECT_KEY,
            JIRASERVER_USERNAME: env.JIRASERVER_USERNAME,
            XRAYSERVER_TEST_PLAN_KEY: env.XRAYSERVER_TEST_PLAN_KEY
          }' > "$SECRET_FILE"

          echo "Migrating repository secrets to AWS Secrets Manager..."
          echo "Target secret: $AWS_SECRET_NAME"

          if aws secretsmanager describe-secret \
              --secret-id "$AWS_SECRET_NAME" \
              >/dev/null 2>&1; then

            echo "AWS secret already exists. Updating it..."

            aws secretsmanager put-secret-value \
              --secret-id "$AWS_SECRET_NAME" \
              --secret-string "file://$SECRET_FILE" \
              >/dev/null

            echo "AWS secret updated successfully."

          else

            echo "AWS secret does not exist. Creating it..."

            aws secretsmanager create-secret \
              --name "$AWS_SECRET_NAME" \
              --secret-string "file://$SECRET_FILE" \
              >/dev/null

            echo "AWS secret created successfully."
          fi

          echo "Migration completed."
