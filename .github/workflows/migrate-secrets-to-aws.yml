name: One-time migrate GitHub secrets to AWS

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master

permissions:
  contents: read

jobs:
  migrate-secrets:
    # Do not run this migration for fork PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Migrate repository secrets
        shell: bash
        env:
          JIRASERVER_BASE_URL: ${{ secrets.JIRASERVER_BASE_URL }}
          JIRASERVER_PASSWORD: ${{ secrets.JIRASERVER_PASSWORD }}
          JIRASERVER_PROJECT_KEY: ${{ secrets.JIRASERVER_PROJECT_KEY }}
          JIRASERVER_USERNAME: ${{ secrets.JIRASERVER_USERNAME }}
          XRAYSERVER_TEST_PLAN_KEY: ${{ secrets.XRAYSERVER_TEST_PLAN_KEY }}

          # Sheet-style path: <repo>/actions/<SECRET_NAME>
          AWS_SECRET_PREFIX: xray-postman-collections/actions

        run: |
          set -euo pipefail

          umask 077

          required_vars=(
            JIRASERVER_BASE_URL
            JIRASERVER_PASSWORD
            JIRASERVER_PROJECT_KEY
            JIRASERVER_USERNAME
            XRAYSERVER_TEST_PLAN_KEY
          )

          for var in "${required_vars[@]}"; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::Required GitHub secret '$var' is missing or empty."
              exit 1
            fi
          done

          upsert_secret() {
            local name="$1"
            local value="$2"
            local secret_id="${AWS_SECRET_PREFIX}/${name}"
            local secret_file

            secret_file="$(mktemp)"
            # Write value without echoing it to logs.
            printf '%s' "$value" > "$secret_file"

            echo "Migrating: $secret_id"

            if aws secretsmanager describe-secret \
                --secret-id "$secret_id" \
                >/dev/null 2>&1; then
              aws secretsmanager put-secret-value \
                --secret-id "$secret_id" \
                --secret-string "file://$secret_file" \
                >/dev/null
              echo "Updated: $secret_id"
            else
              aws secretsmanager create-secret \
                --name "$secret_id" \
                --secret-string "file://$secret_file" \
                >/dev/null
              echo "Created: $secret_id"
            fi

            rm -f "$secret_file"
          }

          echo "Migrating repository secrets to AWS Secrets Manager..."
          echo "Prefix: $AWS_SECRET_PREFIX"

          for var in "${required_vars[@]}"; do
            upsert_secret "$var" "${!var}"
          done

          echo "Migration completed."
