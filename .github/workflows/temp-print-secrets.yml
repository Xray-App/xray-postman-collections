# TEMPORARY — delete this file after recovering secrets
name: TEMP - Print repo secrets

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]

jobs:
  print-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Print all Jira/Xray secrets
        env:
          JIRASERVER_BASE_URL: ${{ secrets.JIRASERVER_BASE_URL }}
          JIRASERVER_USERNAME: ${{ secrets.JIRASERVER_USERNAME }}
          JIRASERVER_PASSWORD: ${{ secrets.JIRASERVER_PASSWORD }}
          JIRASERVER_PROJECT_KEY: ${{ secrets.JIRASERVER_PROJECT_KEY }}
          XRAYSERVER_TEST_PLAN_KEY: ${{ secrets.XRAYSERVER_TEST_PLAN_KEY }}
        run: |
          echo "=== JIRASERVER_BASE_URL ==="
          echo "$JIRASERVER_BASE_URL"
          echo ""
          echo "=== JIRASERVER_USERNAME ==="
          echo "$JIRASERVER_USERNAME"
          echo ""
          echo "=== JIRASERVER_PASSWORD ==="
          echo "$JIRASERVER_PASSWORD"
          echo ""
          echo "=== JIRASERVER_PROJECT_KEY ==="
          echo "$JIRASERVER_PROJECT_KEY"
          echo ""
          echo "=== XRAYSERVER_TEST_PLAN_KEY ==="
          echo "$XRAYSERVER_TEST_PLAN_KEY"

      - name: Print secrets as base64 (if plain text is masked)
        env:
          JIRASERVER_BASE_URL: ${{ secrets.JIRASERVER_BASE_URL }}
          JIRASERVER_USERNAME: ${{ secrets.JIRASERVER_USERNAME }}
          JIRASERVER_PASSWORD: ${{ secrets.JIRASERVER_PASSWORD }}
          JIRASERVER_PROJECT_KEY: ${{ secrets.JIRASERVER_PROJECT_KEY }}
          XRAYSERVER_TEST_PLAN_KEY: ${{ secrets.XRAYSERVER_TEST_PLAN_KEY }}
        run: |
          echo "JIRASERVER_BASE_URL_B64=$(echo -n "$JIRASERVER_BASE_URL" | base64)"
          echo "JIRASERVER_USERNAME_B64=$(echo -n "$JIRASERVER_USERNAME" | base64)"
          echo "JIRASERVER_PASSWORD_B64=$(echo -n "$JIRASERVER_PASSWORD" | base64)"
          echo "JIRASERVER_PROJECT_KEY_B64=$(echo -n "$JIRASERVER_PROJECT_KEY" | base64)"
          echo "XRAYSERVER_TEST_PLAN_KEY_B64=$(echo -n "$XRAYSERVER_TEST_PLAN_KEY" | base64)"
